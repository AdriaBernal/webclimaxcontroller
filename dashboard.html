<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="index.html"
            class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <span class="fs-4"><img class="ms-3" src="../assets/brand/logo.png" alt="Logo" width="40" height="40" class="me-2">ClimaX Controller</span>
        </a>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="index.html" class="nav-link">Inici</a></li>
            <li class="nav-item"><a href="documentation.html" class="nav-link">Documentació</a></li>
            <li class="nav-item d-none" id="dashboard-link">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
            </li>
            <li class="nav-item d-none" id="manage-users-link">
                <a href="manageusers.html" class="nav-link">Gestió d'usuaris</a>
            </li>
            <li class="nav-item" id="nav-login-item">
                <a href="login.html" class="nav-link">Inicia Sessió</a>
            </li>
        </ul>
    </header>

    <div class="container">
        <div class="row g-3">

            <!-- Mapa -->
            <div id="map-section" class="col-12 col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Mapa de sensors</h5>
                        <div id="map" style="height: 460px;"></div>
                    </div>
                </div>
            </div>

            <!-- Dues gràfiques apilades -->
            <div class="col-12 col-lg-4 d-flex flex-column gap-3" id="charts-section">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title" id="chart-meteo-title">Temperatura i Humitat</h6>
                        <canvas id="chart-meteo"></canvas>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title" id="chart-pressure-title">Pressió atmosfèrica</h6>
                        <canvas id="chart-pressure"></canvas>
                    </div>
                </div>
            </div>

            <!-- Taula (amplada completa, sota mapa i gràfiques) -->
            <div class="col-12">
                <table class="table table-hover mt-1" id="sensor-table">
                    <thead class="table-light">
                        <tr>
                            <th>Hora</th>
                            <th>Temperatura (°C)</th>
                            <th>Humitat (%)</th>
                            <th>Pressió (hPa)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="container">
        <footer class="py-3 my-4">
            <hr>
            <p class="text-center text-body-secondary">© 2025-2026 ClimaX Controller</p>
        </footer>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/session.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
